name: pacto
description: "Lokale Vertrags- und Abo-Verwaltung mit Nachlasshilfe."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Database (drift with native SQLite)
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # State management
  flutter_riverpod: ^2.6.0

  # Utilities
  uuid: ^4.5.0
  intl: ^0.20.0
  crypto: ^3.0.0
  pointycastle: ^4.0.0
  shared_preferences: ^2.5.0

  # Network
  http: ^1.2.0

  # File handling
  file_picker: ^8.3.0
  url_launcher: ^6.3.0

  # Cloud & AI (phases 6+)
  supabase_flutter: ^2.8.0

flutter:
  uses-material-design: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.0
  build_runner: ^2.4.0
