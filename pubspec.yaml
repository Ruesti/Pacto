name: pacto
description: "Lokale Vertrags- und Abo-Verwaltung mit Nachlasshilfe."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Database (drift with native SQLite)
  drift: ^2.22.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # State management
  flutter_riverpod: ^2.6.0

  # Utilities
  uuid: ^4.5.0
  intl: ^0.20.0
  crypto: ^3.0.0
  pointycastle: ^4.0.0
  shared_preferences: ^2.5.0

  # Network
  http: ^1.2.0

  # File handling
  file_picker: ^8.3.0
  url_launcher: ^6.3.0
  webview_flutter: ^4.10.0
  pdf: ^3.11.0
  printing: ^5.13.0

  # Cloud & AI (phases 6+)
  receive_sharing_intent: ^1.8.1
  workmanager: ^0.9.0+3
  purchases_flutter: ^10.1.1
  sqlcipher_flutter_libs: ^0.6.0
  sqlite3: ^2.7.0
  flutter_secure_storage: ^10.3.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/hero_bg.png

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.0
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# App-Icon — Quelle: assets/icon/icon.png (1024x1024, opak)
# Generieren: flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  # Adaptive Icon (Android): dunkler Hintergrund + Icon als Vordergrund.
  # Optional eigene gepaddete Vordergrund-Datei: assets/icon/icon_foreground.png
  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: "assets/icon/icon.png"

# Splash-Screen — Generieren: flutter pub run flutter_native_splash:create
flutter_native_splash:
  color: "#0A0A0F"
  image: "assets/icon/icon.png"
  android_12:
    color: "#0A0A0F"
    image: "assets/icon/icon.png"
  android: true
  ios: true
